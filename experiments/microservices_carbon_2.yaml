apiVersion: apps/v1
kind: Deployment
metadata:
  name: m004-duration-1h-deadline-25h
  namespace: default
  labels:
    app: m004-duration-1h-deadline-25h
    duration: duration-1h
    deadline: deadline-25h
  annotations:
    scheduling.carbon/duration_hours: '1'
    scheduling.carbon/deadline_hours: '25'
spec:
  replicas: 1
  selector:
    matchLabels:
      name: m004-duration-1h-deadline-25h
  template:
    metadata:
      labels:
        name: m004-duration-1h-deadline-25h
      annotations:
        scheduling.carbon/duration_hours: '1'
        scheduling.carbon/deadline_hours: '25'
    spec:
      schedulerName: fogatlas
      containers:
      - name: fake-container
        image: fake-image
        resources:
          requests:
            memory: 1Gi
            cpu: 1000m
