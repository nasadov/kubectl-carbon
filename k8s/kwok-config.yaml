apiVersion: config.kwok.x-k8s.io/v1alpha1
components:
- args:
  - --name=node0
  - --auto-compaction-retention=1
  - --quota-backend-bytes=8589934592
  - --data-dir=/etcd-data
  - --initial-advertise-peer-urls=http://0.0.0.0:2380
  - --listen-peer-urls=http://0.0.0.0:2380
  - --advertise-client-urls=http://0.0.0.0:2379
  - --listen-client-urls=http://0.0.0.0:2379
  - --initial-cluster=node0=http://0.0.0.0:2380
  command:
  - etcd
  image: registry.k8s.io/etcd:3.5.11-0
  metric:
    host: kwok-carbon-etcd:2379
    path: /metrics
    scheme: http
  name: etcd
  ports:
  - hostPort: 32765
    port: 2379
  version: 3.5.11-0
  workDir: /root/.kwok/clusters/carbon
- args:
  - --etcd-prefix=/registry
  - --allow-privileged=true
  - --etcd-servers=http://kwok-carbon-etcd:2379
  - --authorization-mode=Node,RBAC
  - --bind-address=0.0.0.0
  - --secure-port=6443
  - --tls-cert-file=/etc/kubernetes/pki/admin.crt
  - --tls-private-key-file=/etc/kubernetes/pki/admin.key
  - --client-ca-file=/etc/kubernetes/pki/ca.crt
  - --service-account-key-file=/etc/kubernetes/pki/admin.key
  - --service-account-signing-key-file=/etc/kubernetes/pki/admin.key
  - --service-account-issuer=https://kubernetes.default.svc.cluster.local
  - --proxy-client-key-file=/etc/kubernetes/pki/admin.key
  - --proxy-client-cert-file=/etc/kubernetes/pki/admin.crt
  command:
  - kube-apiserver
  image: registry.k8s.io/kube-apiserver:v1.30.4
  links:
  - etcd
  metric:
    certPath: /etc/kubernetes/pki/admin.crt
    host: kwok-carbon-kube-apiserver:6443
    insecureSkipVerify: true
    keyPath: /etc/kubernetes/pki/admin.key
    path: /metrics
    scheme: https
  name: kube-apiserver
  ports:
  - hostPort: 32766
    port: 6443
  version: 1.30.4
  volumes:
  - hostPath: /root/.kwok/clusters/carbon/pki/ca.crt
    mountPath: /etc/kubernetes/pki/ca.crt
    readOnly: true
  - hostPath: /root/.kwok/clusters/carbon/pki/admin.crt
    mountPath: /etc/kubernetes/pki/admin.crt
    readOnly: true
  - hostPath: /root/.kwok/clusters/carbon/pki/admin.key
    mountPath: /etc/kubernetes/pki/admin.key
    readOnly: true
  workDir: /root/.kwok/clusters/carbon
- args:
  - --node-monitor-period=25s
  - --node-monitor-grace-period=3m20s
  - --kubeconfig=/root/.kube/config
  - --authorization-always-allow-paths=/healthz,/readyz,/livez,/metrics
  - --bind-address=0.0.0.0
  - --secure-port=10257
  - --root-ca-file=/etc/kubernetes/pki/ca.crt
  - --service-account-private-key-file=/etc/kubernetes/pki/admin.key
  command:
  - kube-controller-manager
  image: registry.k8s.io/kube-controller-manager:v1.30.4
  links:
  - kube-apiserver
  metric:
    certPath: /etc/kubernetes/pki/admin.crt
    host: kwok-carbon-kube-controller-manager:10257
    insecureSkipVerify: true
    keyPath: /etc/kubernetes/pki/admin.key
    path: /metrics
    scheme: https
  name: kube-controller-manager
  version: 1.30.4
  volumes:
  - hostPath: /root/.kwok/clusters/carbon/kubeconfig
    mountPath: /root/.kube/config
    readOnly: true
  - hostPath: /root/.kwok/clusters/carbon/pki/ca.crt
